# Per-control partition applicability — auditor-facing flat table.
# Values per partition: applicable | not_applicable | partial
# `reason` is required when not_applicable or partial.
# Keep this file in sync with `tag applicable_partitions:` on each control.
#
# All cis-cloudtrail controls target both AWS Commercial and
# AWS GovCloud non-DoD. CloudTrail, S3, KMS, CloudWatch Logs, and AWS
# Organizations are all available in both partitions; partition-specific
# behaviour (e.g., S3 Object Lock GA dates, Insight events) is documented
# per-control where it matters.

controls:
  - id: CT-1.1
    title: "Trail is_logging == true"
    aws: applicable
    aws-us-gov: applicable
    reason: ''

  - id: CT-1.2
    title: "Trail latest delivery error empty + recent"
    aws: applicable
    aws-us-gov: applicable
    reason: ''

  - id: CT-1.3
    title: "Trail digest delivery error empty"
    aws: applicable
    aws-us-gov: applicable
    reason: ''

